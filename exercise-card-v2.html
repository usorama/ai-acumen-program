<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Card V2 - Neo-Brutalist Design</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #000000;
            --card-bg: #ffffff;
            --accent-yellow: #ffff00;
            --accent-red: #ff0000;
            --accent-blue: #0066ff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-width: 3px;
            --border-radius: 0px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--primary-bg);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            position: relative;
            width: 320px;
            height: 400px;
        }

        .exercise-card {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border: var(--border-width) solid var(--text-primary);
            border-radius: var(--border-radius);
            position: relative;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            overflow: hidden;
        }

        /* Neo-brutalist "shadow" using offset technique */
        .exercise-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 100%;
            height: 100%;
            background: var(--accent-yellow);
            border: var(--border-width) solid var(--text-primary);
            z-index: -1;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-card:hover {
            transform: translate(4px, 4px);
        }

        .exercise-card:hover::before {
            transform: translate(-4px, -4px);
            background: var(--accent-blue);
        }

        .exercise-card:active {
            transform: translate(8px, 8px);
        }

        .exercise-card:active::before {
            transform: translate(-8px, -8px);
            background: var(--accent-red);
        }

        .card-header {
            background: var(--text-primary);
            color: var(--card-bg);
            padding: 16px;
            position: relative;
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--accent-yellow) 0px,
                var(--accent-yellow) 8px,
                var(--text-primary) 8px,
                var(--text-primary) 16px
            );
        }

        .exercise-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .exercise-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .card-body {
            padding: 24px 16px;
            height: calc(100% - 80px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .scenario-section {
            margin-bottom: 24px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            border-left: 4px solid var(--accent-yellow);
            padding-left: 8px;
        }

        .scenario-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .solution-section {
            background: var(--text-primary);
            color: var(--card-bg);
            margin: 0 -16px -24px -16px;
            padding: 16px;
            position: relative;
        }

        .solution-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--accent-yellow) 0px,
                var(--accent-yellow) 6px,
                var(--accent-red) 6px,
                var(--accent-red) 12px,
                var(--accent-blue) 12px,
                var(--accent-blue) 18px
            );
        }

        .solution-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .solution-text {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .interaction-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 12px;
            height: 12px;
            background: var(--accent-yellow);
            border: 2px solid var(--text-primary);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-card:hover .interaction-indicator {
            background: var(--accent-blue);
            transform: rotate(45deg);
        }

        .exercise-card:active .interaction-indicator {
            background: var(--accent-red);
            transform: rotate(90deg) scale(1.2);
        }

        /* Geometric accent elements */
        .geometric-accent {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
        }

        .geometric-accent::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 20px solid var(--accent-yellow);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .geometric-accent::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 20px;
            background: var(--text-primary);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-card:hover .geometric-accent::before {
            border-bottom-color: var(--accent-blue);
            transform: rotate(180deg);
        }

        .exercise-card:hover .geometric-accent::after {
            background: var(--accent-blue);
        }

        .exercise-card:active .geometric-accent::before {
            border-bottom-color: var(--accent-red);
            transform: rotate(270deg);
        }

        .exercise-card:active .geometric-accent::after {
            background: var(--accent-red);
        }

        /* Status indicator */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-yellow);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-card:hover .status-bar {
            background: var(--accent-blue);
            height: 4px;
        }

        .exercise-card:active .status-bar {
            background: var(--accent-red);
            height: 6px;
        }

        @media (max-width: 480px) {
            .card-container {
                width: 280px;
                height: 360px;
            }

            .exercise-title {
                font-size: 16px;
            }

            .scenario-text {
                font-size: 14px;
            }

            .solution-text {
                font-size: 18px;
            }
        }

        /* Animation for selection feedback */
        @keyframes brutalist-select {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(12px, 12px) scale(0.98); }
            100% { transform: translate(8px, 8px) scale(1); }
        }

        .exercise-card.selected {
            animation: brutalist-select 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-card.selected::before {
            background: var(--accent-red);
        }

        .exercise-card.selected .status-bar {
            background: var(--accent-red);
            height: 6px;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="exercise-card" onclick="toggleSelection(this)">
            <div class="status-bar"></div>
            <div class="interaction-indicator"></div>
            
            <div class="card-header">
                <div class="exercise-type">Matching Exercise</div>
                <div class="exercise-title">AI Solution Pairing</div>
            </div>
            
            <div class="card-body">
                <div class="scenario-section">
                    <div class="section-label">Scenario</div>
                    <div class="scenario-text">M&A Due Diligence Document Analysis</div>
                </div>
                
                <div class="solution-section">
                    <div class="solution-label">Target Solution</div>
                    <div class="solution-text">Claude (Anthropic)</div>
                </div>
            </div>
            
            <div class="geometric-accent"></div>
        </div>
    </div>

    <script>
        function toggleSelection(card) {
            // Remove selected class from all cards (if there are multiple)
            document.querySelectorAll('.exercise-card').forEach(c => c.classList.remove('selected'));
            
            // Add selected class to clicked card
            card.classList.add('selected');
            
            // Remove selected class after animation
            setTimeout(() => {
                card.classList.remove('selected');
            }, 300);
            
            // Optional: Add logic here for actual matching functionality
            console.log('Card selected: M&A Due Diligence → Claude (Anthropic)');
        }

        // Add keyboard accessibility
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                const focusedCard = document.querySelector('.exercise-card:focus');
                if (focusedCard) {
                    e.preventDefault();
                    toggleSelection(focusedCard);
                }
            }
        });

        // Make card focusable for accessibility
        document.querySelector('.exercise-card').setAttribute('tabindex', '0');
    </script>
</body>
</html>
